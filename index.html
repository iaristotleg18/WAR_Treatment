<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The World Is a Ghetto — Microsite</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="logo-mark">TWG</div>
    <nav class="site-nav">
      <a href="#what">WHAT IT IS</a>
      <a href="#when">WHEN IT IS</a>
      <a href="#where">WHERE IT IS</a>
      <a href="#who">WHO IT IS</a>
    </nav>
  </header>

  <main>
    <!-- HERO / MONTAGE -->
    <section class="hero" id="hero">

      <!-- INTRO OVERLAY -->
      <div id="intro" class="overlay intro">
        <div class="intro-inner">
          <h1>The World Is a Ghetto</h1>
          <p>A true story. South L.A., 1969–1979.</p>
          <button id="startBtn" class="primary-btn">Start Experience</button>
        </div>
      </div>

      <!-- MONTAGE STAGE -->
      <div id="stage" class="stage"></div>

      <!-- HUD -->
      <div class="hud">
        <div id="flash" class="flash"></div>
        <div class="hud-row">
          <span id="counter" class="counter">CUT 00 / 00</span>
          <span id="clock" class="clock">00:00.0</span>
        </div>
        <div class="progress">
          <div id="fill" class="progress-fill"></div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div id="controls" class="controls">
        <button id="replayBtn">Replay</button>
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
        <button id="scoreBtn">🔊 Score</button>
      </div>

      <!-- OUTRO -->
      <div id="outro" class="overlay outro" style="display:none;">
        <div class="outro-inner">
          <h2>The World Is a Ghetto</h2>
          <p>Scroll to read the file.</p>
          <button id="replayBtn" class="primary-btn">Watch Again</button>
        </div>
      </div>

    </section>

    <!-- DOSSIER SECTIONS — YOUR TEXT ONLY -->
    <section id="what" class="panel">
      <h3>WHAT IT IS</h3>
      <div class="user-text">
        <!-- YOUR TEXT GOES HERE -->
      </div>
    </section>

    <section id="when" class="panel">
      <h3>WHEN IT IS</h3>
      <div class="user-text">
        <!-- YOUR TEXT GOES HERE -->
      </div>
    </section>

    <section id="where" class="panel">
      <h3>WHERE IT IS</h3>
      <div class="user-text">
        <!-- YOUR TEXT GOES HERE -->
      </div>
    </section>

    <section id="who" class="panel">
      <h3>WHO IT IS</h3>
      <div class="user-text">
        <!-- YOUR TEXT GOES HERE -->
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <span>WAR — “The World Is a Ghetto”, 1972</span>
  </footer>

  <script src="montage.js"></script>
</body>
</html>
